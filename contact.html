<form action="https://formsubmit.co/YOUR_RANDOM_STRING_HERE" method="POST">

    <!-- Security & settings -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="New contact form message">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="thankyou.html">

    <!-- Name -->
    <div class="fcf-form-group">
        <label for="Name" class="fcf-label">Your Name</label>
        <input type="text" id="Name" name="name" class="fcf-form-control" required>
    </div>

    <!-- Email -->
    <div class="fcf-form-group">
        <label for="Email" class="fcf-label">Your Email</label>
        <input type="email" id="Email" name="email" class="fcf-form-control" required>
    </div>

    <!-- Message -->
    <div class="fcf-form-group">
        <label for="Message" class="fcf-label">Your Message</label>
        <textarea id="Message" name="message" class="fcf-form-control" rows="6" required></textarea>
    </div>

    <!-- Submit -->
    <div class="fcf-form-group">
        <button type="submit" class="fcf-btn fcf-btn-primary">
            Send Message
        </button>
    </div>

</form>
